name: Deploy ORBIS to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orbis-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Check and optionally publish ORBIS PWA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ORBIS checks
        run: node --test tests/orbis-static.test.mjs

      - name: Install Wrangler
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: npm install --global wrangler@4

      - name: Deploy Worker and static PWA assets
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Explain skipped Cloudflare deployment
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: echo "::notice::Static checks passed. Cloudflare Worker deployment was skipped because CF_API_TOKEN and/or CF_ACCOUNT_ID are not configured. Vercel remains the active ORBIS host."
