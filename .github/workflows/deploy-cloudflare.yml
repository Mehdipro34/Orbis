name: Deploy ORBIS to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: orbis-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish ORBIS PWA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ORBIS checks
        run: node --test tests/orbis-static.test.mjs

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Worker and static PWA assets
        run: wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
