name: ORBIS Next.js v2 checks

on:
  push:
    branches: [nextjs-v2]
  pull_request:
    branches: [main]
    paths:
      - "src/app/**"
      - "src/components/**"
      - "src/lib/**"
      - "tests/**/*.test.ts"
      - "package.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vitest.config.ts"
      - ".github/workflows/test-nextjs-v2.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint, typecheck, test and build
        run: npm run check
