name: ORBIS Next.js v2 checks

on:
  push:
    branches: [nextjs-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbis-nextjs-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and legacy regression tests
        run: npm test
      - name: Production build
        run: npm run build
